[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/ports",
  "crates/application",
  "crates/platform-windows",
  "crates/menv-core",
  "apps/tauri/src-tauri",
]

[workspace.package]
version = "0.0.2"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
